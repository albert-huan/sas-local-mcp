[project]
name = "sas-local-mcp"
version = "0.1.0"
description = "MCP server that lets LLMs read local SAS datasets (sas7bdat/xport) via pyreadstat"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastmcp>=4.0.0,<5.0.0",
    "pandas>=2.0",
    "pyreadstat>=1.2.8",
    "duckdb>=1.1.0",
]

[project.scripts]
sas-local-mcp = "sas_local_mcp.stdio_server:main"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
